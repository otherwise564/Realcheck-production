<!DOCTYPE html>
<html>
<head>
<title>RealCheck - Verify Anyone</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#f4f6f8;margin:0;padding:20px;text-align:center}
.box{background:white;max-width:500px;margin:auto;padding:25px;border-radius:15px;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
h1{color:#0a7a42;margin:0}
p{color:#555}
input{width:90%;padding:13px;border:1px solid #ddd;border-radius:10px;margin:10px 0}
button{width:95%;padding:14px;margin:8px 0;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}
.green{background:#0a7a42;color:white}
.blue{background:#0a4d8c;color:white}
.orange{background:#ff7a00;color:white}
.small{font-size:13px;color:#888;margin-top:15px}
</style>
</head>
<body>
<div class="box">
<h1>✅ RealCheck</h1>
<p><b>Verify Anyone, Before You Trust Them</b></p>
<p>Check NIN, Business (CAC) & Phone in seconds.</p>

<input type="text" placeholder="Enter NIN, CAC Number or Phone...">

<button class="green">Verify NIN</button>
<button class="blue">Verify Business (CAC)</button>
<button class="orange">Verify Phone Number</button>

<p class="small">RealCheck Nigeria • Fast • Trusted • Secure<br>₦500 per check</p>
</div>
</body>
</html>
